AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-ha-web-platform registry stack. The ECR repository for the Notes API
  image. It lives in its own stack, deployed before compute, so an image can
  be pushed before the ECS service is created, and images survive a compute
  teardown.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Environment name, used in resource names and tags.

  ImagesToKeep:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Tagged images kept; older ones are expired by the lifecycle policy.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub aws-ha-web-platform/${EnvironmentName}/notes-api
      # A tag always points at the same image, so a task definition that
      # names a tag runs exactly what was tested.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      # KMS with the AWS managed key for ECR: encrypted at rest with no key
      # to pay for or manage. The images hold no secrets.
      EncryptionConfiguration:
        EncryptionType: KMS
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the last ${ImagesToKeep} images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${ImagesToKeep}
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

Outputs:
  RepositoryName:
    Value: !Ref Repository
    Export: { Name: !Sub "${AWS::StackName}-RepositoryName" }
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export: { Name: !Sub "${AWS::StackName}-RepositoryArn" }
  RepositoryUri:
    Description: Push images here as <uri>:<git sha>.
    Value: !GetAtt Repository.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-RepositoryUri" }
