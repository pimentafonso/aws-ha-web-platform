<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Current architecture: local stack and network stack (in code)</title>
  <desc id="desc">Top: a client calls the Notes API container over HTTP. The API reads and writes PostgreSQL, running migrations under an advisory lock, and uses Redis as a cache-aside layer, all in docker compose on a developer machine. Bottom: the CloudFormation network stack, written and linted but not deployed. A VPC across two Availability Zones has public, private-app and private-data subnets. Private-app subnets route to NAT in the public subnets: a NAT instance in dev, a NAT Gateway per AZ in prod. Data subnets have no default route. An S3 gateway endpoint serves ECR image layers, interface endpoints for ECR, CloudWatch Logs and Secrets Manager exist in prod, and prod sends VPC flow logs to a KMS-encrypted log group.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e2f3ef; stroke: #0b7a68; stroke-width: 1.6; }
    .box.code { stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #c7d0da; stroke-width: 1.2; }
    .t { fill: #16202b; font: 600 14px "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .s, .el { fill: #5b6774; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .z { fill: #5b6774; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .05em; }
    .e { stroke: #16202b; stroke-width: 1.4; fill: none; }
    .head { fill: #16202b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #143029; stroke: #45c7ae; }
      .zone { stroke: #30363d; }
      .t { fill: #e6edf3; }
      .s, .el, .z { fill: #9aa5b1; }
      .e { stroke: #e6edf3; }
      .head { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="650" rx="10"/>

  <!-- Local stack (running) -->
  <rect class="box" x="20" y="97" width="170" height="56" rx="6"/>
  <text class="t" x="105" y="121" text-anchor="middle">curl · npm test</text>
  <text class="s" x="105" y="139" text-anchor="middle">localhost:3000</text>

  <rect class="zone" x="240" y="20" width="740" height="210" rx="10"/>
  <text class="z" x="256" y="42">DOCKER COMPOSE (LOCAL)</text>

  <rect class="box" x="280" y="90" width="230" height="70" rx="6"/>
  <text class="t" x="395" y="113" text-anchor="middle">Notes API</text>
  <text class="s" x="395" y="131" text-anchor="middle">Node 22 · Express 5</text>
  <text class="s" x="395" y="147" text-anchor="middle">/health /ready /api/notes</text>

  <rect class="box" x="740" y="52" width="210" height="56" rx="6"/>
  <text class="t" x="845" y="76" text-anchor="middle">PostgreSQL 17</text>
  <text class="s" x="845" y="94" text-anchor="middle">:5442 · stand-in for RDS</text>

  <rect class="box" x="740" y="152" width="210" height="56" rx="6"/>
  <text class="t" x="845" y="176" text-anchor="middle">Redis 7</text>
  <text class="s" x="845" y="194" text-anchor="middle">:6389 · stand-in for ElastiCache</text>

  <line class="e" x1="190" y1="125" x2="278" y2="125" marker-end="url(#arrow)"/>
  <text class="el" x="234" y="117" text-anchor="middle">HTTP</text>

  <path class="e" d="M510,110 L620,110 L620,80 L738,80" marker-end="url(#arrow)"/>
  <text class="el" x="626" y="72">SQL · migrations under lock</text>

  <path class="e" d="M510,140 L620,140 L620,180 L738,180" marker-end="url(#arrow)"/>
  <text class="el" x="626" y="172">GET: cache-aside</text>
  <text class="el" x="626" y="200">DELETE: invalidate</text>

  <!-- Network stack (CloudFormation, linted, not deployed) -->
  <text class="z" x="20" y="272">CLOUDFORMATION · network.yaml · WRITTEN AND LINTED, NOT DEPLOYED (dashed)</text>
  <rect class="zone" x="20" y="285" width="960" height="345" rx="10"/>
  <text class="z" x="36" y="306">VPC /16 · eu-west-1</text>
  <text class="z" x="265" y="320" text-anchor="middle">AZ a</text>
  <text class="z" x="555" y="320" text-anchor="middle">AZ b</text>

  <text class="z" x="36" y="363">PUBLIC</text>
  <text class="z" x="36" y="453">APP</text>
  <text class="z" x="36" y="543">DATA</text>

  <rect class="box code" x="130" y="330" width="270" height="56" rx="6"/>
  <text class="t" x="265" y="353" text-anchor="middle">public a · /24</text>
  <text class="s" x="265" y="371" text-anchor="middle">NAT a · instance dev / gateway prod</text>

  <rect class="box code" x="420" y="330" width="270" height="56" rx="6"/>
  <text class="t" x="555" y="353" text-anchor="middle">public b · /24</text>
  <text class="s" x="555" y="371" text-anchor="middle">NAT b · prod only (NatCount 2)</text>

  <rect class="box code" x="720" y="330" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="353" text-anchor="middle">Internet gateway</text>
  <text class="s" x="840" y="371" text-anchor="middle">public route 0.0.0.0/0</text>
  <line class="e" x1="690" y1="358" x2="718" y2="358" marker-end="url(#arrow)"/>

  <rect class="box code" x="130" y="420" width="270" height="56" rx="6"/>
  <text class="t" x="265" y="443" text-anchor="middle">private-app a · /24</text>
  <text class="s" x="265" y="461" text-anchor="middle">Fargate tasks (M2.3)</text>

  <rect class="box code" x="420" y="420" width="270" height="56" rx="6"/>
  <text class="t" x="555" y="443" text-anchor="middle">private-app b · /24</text>
  <text class="s" x="555" y="461" text-anchor="middle">Fargate tasks (M2.3)</text>

  <line class="e" x1="265" y1="420" x2="265" y2="388" marker-end="url(#arrow)"/>
  <text class="el" x="272" y="408">0.0.0.0/0 → NAT a</text>
  <line class="e" x1="555" y1="420" x2="555" y2="388" marker-end="url(#arrow)"/>
  <text class="el" x="562" y="408">→ NAT b (prod), NAT a (dev)</text>

  <rect class="box code" x="720" y="420" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="443" text-anchor="middle">S3 gateway endpoint</text>
  <text class="s" x="840" y="461" text-anchor="middle">free · ECR layer bucket only</text>

  <rect class="box code" x="130" y="510" width="270" height="56" rx="6"/>
  <text class="t" x="265" y="533" text-anchor="middle">private-data a · /24</text>
  <text class="s" x="265" y="551" text-anchor="middle">no default route</text>

  <rect class="box code" x="420" y="510" width="270" height="56" rx="6"/>
  <text class="t" x="555" y="533" text-anchor="middle">private-data b · /24</text>
  <text class="s" x="555" y="551" text-anchor="middle">no default route</text>

  <rect class="box code" x="720" y="496" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="519" text-anchor="middle">Interface endpoints</text>
  <text class="s" x="840" y="537" text-anchor="middle">prod · ECR, Logs, Secrets</text>

  <rect class="box code" x="720" y="562" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="585" text-anchor="middle">VPC flow logs</text>
  <text class="s" x="840" y="603" text-anchor="middle">prod · CloudWatch · KMS key</text>

  <text class="el" x="130" y="600">No subnet auto-assigns public IPs.</text>
  <text class="el" x="130" y="616">dev 10.10.0.0/16 · prod 10.20.0.0/16</text>
</svg>
