<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Current architecture: local stack and all AWS stacks up to the edge (in code)</title>
  <desc id="desc">Top: a client calls the Notes API container over HTTP. The API reads and writes PostgreSQL, running migrations under an advisory lock, and uses Redis as a cache-aside layer, all in docker compose on a developer machine. Bottom: the CloudFormation network stack, written and linted but not deployed. A VPC across two Availability Zones has public, private-app and private-data subnets. Private-app subnets route to NAT in the public subnets: a NAT instance in dev, a NAT Gateway per AZ in prod. Data subnets have no default route. An S3 gateway endpoint serves ECR image layers, interface endpoints for ECR, CloudWatch Logs and Secrets Manager exist in prod, and prod sends VPC flow logs to a KMS-encrypted log group. The CloudFormation data stack, also written and linted but not deployed, puts RDS PostgreSQL 17 (single-AZ in dev, Multi-AZ standby in AZ b in prod) and ElastiCache for Valkey (one node in dev, a replica in AZ b in prod) in the data subnets. They accept connections only from the app security group, over TLS, and are encrypted with a KMS data key; the database password and Valkey token live in Secrets Manager. The compute stack, also written and linted but not deployed, adds an Application Load Balancer in the public subnets that accepts only CloudFront, and Arm64 Fargate tasks in both private-app subnets that connect to PostgreSQL with IAM authentication. Images come from an ECR repository in its own registry stack, and migrations run as a one-off ECS task. In front, written but not deployed: CloudFront with WAF (prod) sends API paths to the ALB with a secret origin header and /static/ paths to a private S3 bucket; Route 53 hosts the delegated subdomain in prod.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e2f3ef; stroke: #0b7a68; stroke-width: 1.6; }
    .box.code { stroke-dasharray: 6 4; }
    .zone { fill: none; stroke: #c7d0da; stroke-width: 1.2; }
    .t { fill: #16202b; font: 600 14px "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .s, .el { fill: #5b6774; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .z { fill: #5b6774; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .05em; }
    .e { stroke: #16202b; stroke-width: 1.4; fill: none; }
    .head { fill: #16202b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #143029; stroke: #45c7ae; }
      .zone { stroke: #30363d; }
      .t { fill: #e6edf3; }
      .s, .el, .z { fill: #9aa5b1; }
      .e { stroke: #e6edf3; }
      .head { fill: #e6edf3; }
    }
  </style>
