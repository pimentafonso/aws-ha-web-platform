AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-ha-web-platform edge-global stack, deployed to us-east-1. Only the two
  resources CloudFront requires from that Region: the viewer TLS certificate
  and the WAF web ACL (CLOUDFRONT scope). The edge stack in eu-west-1 takes
  their ARNs as parameters; they are not secret. Prod only.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [prod]
    Description: Only prod has a domain and WAF.

  DomainName:
    Type: String
    AllowedPattern: ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$
    Description: The platform's subdomain (same value as the dns stack). Passed at deploy time.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      The dns stack's hosted zone. Passed by the deploy script, because
      exports cannot be imported across Regions.

  RateLimitPer5Min:
    Type: Number
    Default: 1000
    MinValue: 100
    MaxValue: 100000
    Description: Requests one client IP may make in any 5-minute window before WAF blocks it.

  WafLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 90, 180, 365]
    Description: Retention of the WAF request log group, in days.

Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: CloudFront only accepts certificates and CLOUDFRONT-scope web ACLs from us-east-1.

Resources:
  ViewerCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # Evaluated in priority order; the first terminating match wins. Managed
  # rule groups are kept current by AWS. Each rule or group costs $1 a month.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${EnvironmentName}-notes-edge
      Description: !Sub ${EnvironmentName} CloudFront protection for the Notes API
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${EnvironmentName}-notes-edge
      Rules:
        # Cheapest check first: known-bad source addresses (botnets, scanners).
        - Name: aws-ip-reputation
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-ip-reputation
        - Name: rate-limit-per-ip
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Min
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
        # OWASP-style protections: XSS, path traversal, bad user agents and
        # similar. Its 8 KB body limit would block valid notes (content may
        # be 10,000 characters), so that one rule only counts; the API
        # rejects bodies over 32 KB itself.
        - Name: aws-common
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common
        # Request patterns known to exploit vulnerabilities, including Log4j.
        - Name: aws-known-bad-inputs
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # ---------------------------------------------------------------------------
  # WAF request logs. The destination must be in the web ACL's Region
  # (us-east-1 for CloudFront scope) and its name must start aws-waf-logs-.
  # The logs hold client IPs and request headers, so they get their own key
  # (the eu-west-1 logs key cannot be used from this Region).
  # ---------------------------------------------------------------------------
  WafLogsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub ${EnvironmentName} WAF request log encryption key
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: CloudWatchLogsInThisAccountAndRegion
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub aws-waf-logs-${EnvironmentName}-notes-edge
      RetentionInDays: !Ref WafLogRetentionDays
      KmsKeyId: !GetAtt WafLogsKey.Arn
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # Only blocked and counted requests are logged: allowed traffic is already
  # in the ALB and CloudFront access logs, and ingestion costs $0.57 per GB.
  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      # WAF wants the log group ARN without the trailing :* that GetAtt adds.
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition: { Action: BLOCK }
              - ActionCondition: { Action: COUNT }

Outputs:
  ViewerCertificateArn:
    Description: Pass to the edge stack (eu-west-1) as ViewerCertificateArn.
    Value: !Ref ViewerCertificate
  WebAclArn:
    Description: Pass to the edge stack (eu-west-1) as WebAclArn.
    Value: !GetAtt WebAcl.Arn
