AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-ha-web-platform compute stack. Application Load Balancer that only
  CloudFront can reach, ECS Fargate service (Graviton) across two AZs with
  target-tracking auto scaling, a one-off migration task definition, least-
  privilege IAM roles and the application log group. Imports the network,
  data and registry stacks' exports.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Environment }
        Parameters: [EnvironmentName, NetworkStackName, LoggingStackName, DataStackName, RegistryStackName, LoggingMode]
      - Label: { default: Load balancer }
        Parameters: [CloudFrontPrefixListId, DnsStackName, AlbDeletionProtection]
      - Label: { default: Service }
        Parameters:
          - ImageTag
          - ServiceEnabled
          - TaskCpu
          - TaskMemory
          - MinTasks
          - MaxTasks
          - CpuTargetPercent
          - DbAppUser
          - ContainerInsights
          - LogRetentionDays

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Environment name, used in resource names and tags.

  NetworkStackName:
    Type: String
    AllowedPattern: ^[A-Za-z][A-Za-z0-9-]*$
    Description: Name of the deployed network stack.

  LoggingStackName:
    Type: String
    AllowedPattern: ^[A-Za-z][A-Za-z0-9-]*$
    Description: Name of the deployed logging stack (ALB access logs go to its bucket).

  DataStackName:
    Type: String
    AllowedPattern: ^[A-Za-z][A-Za-z0-9-]*$
    Description: Name of the deployed data stack.

  RegistryStackName:
    Type: String
    AllowedPattern: ^[A-Za-z][A-Za-z0-9-]*$
    Description: Name of the deployed registry (ECR) stack.

  LoggingMode:
    Type: String
    AllowedValues: [full, minimal]
    Description: >-
      Must match the network stack. full = the application log group is
      encrypted with the network stack's logs key.

  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: ^pl-[0-9a-f]+$
    Description: >-
      Id of the AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing
      in this Region. The deploy script looks it up; it is not account-specific.

  DnsStackName:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[A-Za-z][A-Za-z0-9-]*$
    Description: >-
      Name of the deployed dns stack (hosted zone). When set, this stack issues
      an ACM certificate for origin.<domain>, points that name at the ALB and
      serves HTTPS on 443. Empty = HTTP on 80 with the ALB's own DNS name
      (dev, which has no domain).

  AlbDeletionProtection:
    Type: String
    AllowedValues: ["true", "false"]
    Description: Prevents the load balancer being deleted until turned off.

  ImageTag:
    Type: String
    AllowedPattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$
    Description: Image tag in the registry (the git commit SHA).

  ServiceEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      false = service with zero tasks. Used on the first deploy, so the
      migration task can create the database user before any task starts.

  TaskCpu:
    Type: String
    AllowedValues: ["256", "512", "1024"]
    Description: Task CPU units (256 = 0.25 vCPU).

  TaskMemory:
    Type: String
    AllowedValues: ["512", "1024", "2048"]
    Description: Task memory in MiB. Must be a valid Fargate pairing with TaskCpu.

  MinTasks:
    Type: Number
    MinValue: 1
    MaxValue: 10
    Description: Minimum running tasks. 2 or more spreads them across both AZs.

  MaxTasks:
    Type: Number
    MinValue: 1
    MaxValue: 20
    Description: Maximum tasks auto scaling may run.

  CpuTargetPercent:
    Type: Number
    Default: 60
    MinValue: 20
    MaxValue: 90
    Description: Average service CPU that target tracking aims for.

  DbAppUser:
    Type: String
    Default: notes_app
    AllowedPattern: ^[a-z_][a-z0-9_]{0,62}$
    Description: Database user the service connects as with IAM authentication.

  ContainerInsights:
    Type: String
    AllowedValues: [enabled, disabled]
    Default: disabled
    Description: CloudWatch Container Insights (billed as custom metrics).

  LogRetentionDays:
    Type: Number
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: Retention of the application log group, in days.

Rules:
  # Plain HTTP between CloudFront and the ALB is only for dev, which has no
  # domain. Prod refuses to deploy without one, and so without HTTPS.
  ProdRequiresHttps:
    RuleCondition: !Equals [!Ref EnvironmentName, prod]
    Assertions:
      - Assert: !Not [!Equals [!Ref DnsStackName, ""]]
        AssertDescription: prod needs DnsStackName (origin certificate, HTTPS from CloudFront to the ALB).

Conditions:
  FullLogging: !Equals [!Ref LoggingMode, full]
  HasCertificate: !Not [!Equals [!Ref DnsStackName, ""]]
  ServiceOn: !Equals [!Ref ServiceEnabled, "true"]

Resources:
  # ---------------------------------------------------------------------------
  # Origin verification. CloudFront adds this header to every request it
  # forwards, and the listener only forwards requests that carry it. Together
  # with the prefix list, this stops other CloudFront distributions (which
  # share those addresses) from reaching the ALB.
  # ---------------------------------------------------------------------------
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub aws-ha-web-platform/${EnvironmentName}/origin-verify
      Description: !Sub ${EnvironmentName} value of the X-Origin-Verify header CloudFront sends to the ALB
      KmsKeyId: !ImportValue
        Fn::Sub: ${DataStackName}-DataKeyArn
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # ---------------------------------------------------------------------------
  # Load balancer. One ingress rule: the CloudFront prefix list counts as
  # dozens of rules towards the security group quota, so it is used on one
  # port only (443 with a certificate, otherwise 80).
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB, reachable only from CloudFront origin-facing addresses
      VpcId: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - Description: CloudFront origin-facing addresses only
          IpProtocol: tcp
          FromPort: !If [HasCertificate, 443, 80]
          ToPort: !If [HasCertificate, 443, 80]
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      SecurityGroupEgress:
        - Description: To the application tasks
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          DestinationSecurityGroupId: !ImportValue
            Fn::Sub: ${DataStackName}-AppSecurityGroupId
      Tags:
        - { Key: Name, Value: !Sub "${EnvironmentName}-alb" }
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # The app security group belongs to the data stack, which defines no
  # ingress on it; this standalone rule is the only way in.
  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue
        Fn::Sub: ${DataStackName}-AppSecurityGroupId
      Description: HTTP from the load balancer to the API container
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-notes-api
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: ${NetworkStackName}-PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: deletion_protection.enabled, Value: !Ref AlbDeletionProtection }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
        - { Key: idle_timeout.timeout_seconds, Value: "60" } # the app's keep-alive (65 s) is longer
        - { Key: access_logs.s3.enabled, Value: "true" }
        - Key: access_logs.s3.bucket
          Value: !ImportValue
            Fn::Sub: ${LoggingStackName}-AccessLogBucketName
        - { Key: access_logs.s3.prefix, Value: alb }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-notes-api
      TargetType: ip # required for awsvpc (Fargate) tasks
      Protocol: HTTP
      Port: 3000
      VpcId: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId
      # Liveness only: a database failover must not make every target unhealthy.
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        # ECS deregisters a task, waits this long, then sends SIGTERM; the
        # app then has StopTimeout (30 s) to finish, and needs at most 20 s.
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_2
            comment: >-
              HTTPS whenever DnsStackName is set, and the ProdRequiresHttps
              rule makes it mandatory in prod. HTTP is used in dev only, which
              has no domain; CloudFront still adds the origin header there.
          - id: CKV_AWS_103
            comment: >-
              Same listener: with a certificate it uses
              ELBSecurityPolicy-TLS13-1-2-2021-06 (TLS 1.2 minimum). The check
              cannot see through the Fn::If.
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If [HasCertificate, 443, 80]
      Protocol: !If [HasCertificate, HTTPS, HTTP]
      SslPolicy: !If [HasCertificate, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      Certificates: !If
        - HasCertificate
        - [{ CertificateArn: !Ref OriginCertificate }]
        - !Ref AWS::NoValue
      # Anything without the origin header is refused.
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: application/json
            MessageBody: '{"error":"forbidden"}'

  # origin.<domain>: the name CloudFront connects to, so the TLS certificate
  # it checks matches. ACM validates it through a record it writes in the
  # hosted zone, and renews it automatically.
  OriginCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCertificate
    Properties:
      DomainName: !Sub
        - origin.${Domain}
        - Domain: !ImportValue
            Fn::Sub: ${DnsStackName}-DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub
            - origin.${Domain}
            - Domain: !ImportValue
                Fn::Sub: ${DnsStackName}-DomainName
          HostedZoneId: !ImportValue
            Fn::Sub: ${DnsStackName}-HostedZoneId
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  OriginRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCertificate
    Properties:
      HostedZoneId: !ImportValue
        Fn::Sub: ${DnsStackName}-HostedZoneId
      Name: !Sub
        - origin.${Domain}
        - Domain: !ImportValue
            Fn::Sub: ${DnsStackName}-DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  ForwardFromCloudFront:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub "{{resolve:secretsmanager:${OriginVerifySecret}}}"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------------------
  # Logs.
  # ---------------------------------------------------------------------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws-ha-web-platform/${EnvironmentName}/notes-api
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !If
        - FullLogging
        - !ImportValue
          Fn::Sub: ${NetworkStackName}-LogsKeyArn
        - !Ref AWS::NoValue
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # ---------------------------------------------------------------------------
  # IAM. Two execution roles, so the long-running service can never read the
  # database master secret: only the migration task can. The service's task
  # role allows exactly one thing, connecting as DbAppUser with IAM auth.
  # ---------------------------------------------------------------------------
  ServiceExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: ECS pulls the image, writes logs and injects the Valkey token for the service
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pull-log-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*" # this action does not support resource-level permissions
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !ImportValue
                  Fn::Sub: ${RegistryStackName}-RepositoryArn
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${AppLogGroup.Arn}:log-stream:*"
              - Sid: CacheToken
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !ImportValue
                  Fn::Sub: ${DataStackName}-CacheAuthSecretArn
              - Sid: DecryptSecretsOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue
                  Fn::Sub: ${DataStackName}-DataKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: ECS pulls the image, writes logs and injects the database master secret for the migration task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pull-log-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*" # this action does not support resource-level permissions
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !ImportValue
                  Fn::Sub: ${RegistryStackName}-RepositoryArn
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${AppLogGroup.Arn}:log-stream:*"
              - Sid: DatabaseMasterSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !ImportValue
                  Fn::Sub: ${DataStackName}-DbSecretArn
              - Sid: DecryptSecretsOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue
                  Fn::Sub: ${DataStackName}-DataKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  ServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Credentials inside the API container; may only connect to the database as the app user
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: rds-iam-connect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub
                  - arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbAppUser}
                  - DbResourceId: !ImportValue
                      Fn::Sub: ${DataStackName}-DbResourceId
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # ---------------------------------------------------------------------------
  # ECS.
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_65
            comment: >-
              Container Insights is a parameter, off until I have measured its
              cost (billed per metric or per observation). The free ECS service
              CPU and memory metrics already drive auto scaling and alarms.
    Properties:
      ClusterName: !Sub ${EnvironmentName}-notes
      ClusterSettings:
        - { Name: containerInsights, Value: !Ref ContainerInsights }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  ServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-notes-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform:
        CpuArchitecture: ARM64 # Graviton: about 20% cheaper per vCPU and GB
        OperatingSystemFamily: LINUX
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ServiceExecutionRole.Arn
      TaskRoleArn: !GetAtt ServiceTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub
            - ${RepositoryUri}:${ImageTag}
            - RepositoryUri: !ImportValue
                Fn::Sub: ${RegistryStackName}-RepositoryUri
          Essential: true
          ReadonlyRootFilesystem: true # the app writes nothing to disk
          StopTimeout: 30
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "3000" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - Name: DB_HOST
              Value: !ImportValue
                Fn::Sub: ${DataStackName}-DbEndpoint
            - Name: DB_PORT
              Value: !ImportValue
                Fn::Sub: ${DataStackName}-DbPort
            - Name: DB_NAME
              Value: !ImportValue
                Fn::Sub: ${DataStackName}-DbName
            - { Name: DB_USER, Value: !Ref DbAppUser }
            - { Name: DB_AUTH, Value: iam }
            - { Name: DB_SSL_CA_PATH, Value: /etc/ssl/rds/eu-west-1-bundle.pem }
            - { Name: MIGRATE_ON_START, Value: "false" }
            - Name: REDIS_URL
              Value: !Sub
                - rediss://${Host}:${Port}
                - Host: !ImportValue
                    Fn::Sub: ${DataStackName}-CacheEndpoint
                  Port: !ImportValue
                    Fn::Sub: ${DataStackName}-CachePort
          Secrets:
            - Name: REDIS_PASSWORD
              ValueFrom: !ImportValue
                Fn::Sub: ${DataStackName}-CacheAuthSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # Run with `aws ecs run-task` (deploy script) before the service is
  # updated: applies migrations as the database owner and keeps DbAppUser's
  # grants current. Same image as the service, different command.
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-notes-migrate
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt MigrationExecutionRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub
            - ${RepositoryUri}:${ImageTag}
            - RepositoryUri: !ImportValue
                Fn::Sub: ${RegistryStackName}-RepositoryUri
          Essential: true
          ReadonlyRootFilesystem: true
          Command: [node, src/migrate.js]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - Name: DB_HOST
              Value: !ImportValue
                Fn::Sub: ${DataStackName}-DbEndpoint
            - Name: DB_PORT
              Value: !ImportValue
                Fn::Sub: ${DataStackName}-DbPort
            - Name: DB_NAME
              Value: !ImportValue
                Fn::Sub: ${DataStackName}-DbName
            - { Name: DB_AUTH, Value: password }
            - { Name: DB_SSL_CA_PATH, Value: /etc/ssl/rds/eu-west-1-bundle.pem }
            - { Name: DB_APP_USER, Value: !Ref DbAppUser }
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub
                - "${SecretArn}:username::"
                - SecretArn: !ImportValue
                    Fn::Sub: ${DataStackName}-DbSecretArn
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - SecretArn: !ImportValue
                    Fn::Sub: ${DataStackName}-DbSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  Service:
    Type: AWS::ECS::Service
    DependsOn: ForwardFromCloudFront # the target group must be attached to a listener
    Properties:
      ServiceName: notes-api
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref ServiceTaskDefinition
      DesiredCount: !If [ServiceOn, !Ref MinTasks, 0]
      AvailabilityZoneRebalancing: ENABLED
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100 # start new tasks before stopping old ones
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: ${NetworkStackName}-PrivateAppSubnetIds
          SecurityGroups:
            - !ImportValue
              Fn::Sub: ${DataStackName}-AppSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Project, Value: aws-ha-web-platform }

  # Target tracking on average CPU. Uses the Application Auto Scaling
  # service-linked role, so there is no scaling role to manage.
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !If [ServiceOn, !Ref MinTasks, 0]
      MaxCapacity: !If [ServiceOn, !Ref MaxTasks, 0]

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-notes-api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTargetPercent
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 180

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub "${AWS::StackName}-LoadBalancerDnsName" }
  OriginDomainName:
    Description: Name CloudFront uses for the API origin (the edge stack imports it).
    Value: !If [HasCertificate, !Ref OriginRecord, !GetAtt LoadBalancer.DNSName]
    Export: { Name: !Sub "${AWS::StackName}-OriginDomainName" }
  OriginProtocol:
    Description: http-only without a domain (dev), https-only with one (prod).
    Value: !If [HasCertificate, https-only, http-only]
    Export: { Name: !Sub "${AWS::StackName}-OriginProtocol" }
  LoadBalancerFullName:
    Description: CloudWatch LoadBalancer dimension (app/<name>/<id>).
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export: { Name: !Sub "${AWS::StackName}-LoadBalancerFullName" }
  TargetGroupFullName:
    Description: CloudWatch TargetGroup dimension (targetgroup/<name>/<id>).
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub "${AWS::StackName}-TargetGroupFullName" }
  OriginVerifySecretArn:
    Description: Secret holding the X-Origin-Verify header value CloudFront must send.
    Value: !Ref OriginVerifySecret
    Export: { Name: !Sub "${AWS::StackName}-OriginVerifySecretArn" }
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${AWS::StackName}-ClusterName" }
  ServiceName:
    Value: !GetAtt Service.Name
    Export: { Name: !Sub "${AWS::StackName}-ServiceName" }
  MigrationTaskDefinitionArn:
    Description: Run with aws ecs run-task in the private-app subnets and the app security group.
    Value: !Ref MigrationTaskDefinition
  AppLogGroupName:
    Value: !Ref AppLogGroup
    Export: { Name: !Sub "${AWS::StackName}-AppLogGroupName" }
