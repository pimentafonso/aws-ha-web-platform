<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 870" width="1000" height="870" role="img" aria-labelledby="title desc">
  <title id="title">Architecture as deployed in prod on 17 November 2026, with the measured failover results</title>
  <desc id="desc">Deployed to prod on 17 November 2026 and torn down the same day; dev uses the same templates with smaller settings. Viewers reach a delegated subdomain hosted in Route 53, which points at CloudFront. CloudFront, with an ACM certificate and an AWS WAF web ACL from us-east-1, serves /static/ paths from a private S3 bucket through origin access control and sends every other path to an Application Load Balancer, adding a secret X-Origin-Verify header. The ALB sits in the public subnets of a VPC across two Availability Zones in eu-west-1 and accepts only CloudFront. Arm64 Fargate tasks run in both private-app subnets and reach the internet through a NAT Gateway per AZ in prod (one NAT instance in dev). Private-data subnets have no default route and hold RDS PostgreSQL 17, Multi-AZ with a standby in AZ b, and ElastiCache for Valkey with a replica in AZ b. They accept TLS connections only from the app security group; the API connects to PostgreSQL with IAM authentication. A KMS data key encrypts the data tier and Secrets Manager holds the RDS-managed master password and the Valkey token. An S3 gateway endpoint serves ECR image layers, prod has interface endpoints for ECR, CloudWatch Logs and Secrets Manager and VPC flow logs, images come from ECR, and migrations run as a one-off ECS task. Once per account, CloudTrail records every Region; GuardDuty is drawn dashed because the account's Free plan cannot subscribe to it. Per environment there is an access-log bucket and CloudWatch alarms with a dashboard. GitHub Actions deploys through OIDC: STS exchanges the token for a per-environment deploy role, and CloudFormation builds the stacks with an execution role that can only create IAM roles inside a permissions boundary. Bottom row, measured in prod: stopping one of two Fargate tasks caused no errors and the replacement was healthy in 58 seconds; two RDS Multi-AZ failovers completed in 29 and 48 seconds, but the app's database requests failed for about 6 and then 11 to 14 minutes, because IAM authentication on the new primary was not ready; a Valkey failover completed in 22 seconds with no errors, reads falling back to PostgreSQL.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #e2f3ef; stroke: #0b7a68; stroke-width: 1.6; }
    .box.off { fill: none; stroke-dasharray: 6 4; }
    .box.warn { fill: #fbeedb; stroke: #a8650d; }
    .zone { fill: none; stroke: #c7d0da; stroke-width: 1.2; }
    .t { fill: #16202b; font: 600 14px "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .s, .el { fill: #5b6774; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .z { fill: #5b6774; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: .05em; }
    .e { stroke: #16202b; stroke-width: 1.4; fill: none; }
    .head { fill: #16202b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #143029; stroke: #45c7ae; }
      .box.off { fill: none; }
      .box.warn { fill: #33250f; stroke: #e0a24a; }
      .zone { stroke: #30363d; }
      .t { fill: #e6edf3; }
      .s, .el, .z { fill: #9aa5b1; }
      .e { stroke: #e6edf3; }
      .head { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="870" rx="10"/>

  <text class="z" x="20" y="34">AS DEPLOYED · PROD, 17 NOVEMBER 2026 · DEV: SAME TEMPLATES, SMALLER</text>

  <!-- Edge -->
  <rect class="box" x="20" y="60" width="200" height="56" rx="6"/>
  <text class="t" x="120" y="83" text-anchor="middle">Route 53 (prod)</text>
  <text class="s" x="120" y="101" text-anchor="middle">delegated subdomain</text>
  <rect class="box" x="270" y="60" width="420" height="56" rx="6"/>
  <text class="t" x="480" y="83" text-anchor="middle">CloudFront · WAF (prod) · HTTPS</text>
  <text class="s" x="480" y="101" text-anchor="middle">certs + WAF in us-east-1 · adds X-Origin-Verify</text>
  <rect class="box" x="740" y="60" width="220" height="56" rx="6"/>
  <text class="t" x="850" y="83" text-anchor="middle">S3 static (private)</text>
  <text class="s" x="850" y="101" text-anchor="middle">origin access control</text>
  <line class="e" x1="220" y1="88" x2="268" y2="88" marker-end="url(#arrow)"/>
  <line class="e" x1="690" y1="88" x2="738" y2="88" marker-end="url(#arrow)"/>
  <text class="el" x="714" y="56" text-anchor="middle">/static/*</text>
  <line class="e" x1="400" y1="116" x2="400" y2="193" marker-end="url(#arrow)"/>
  <text class="el" x="407" y="137">/api/* → ALB</text>

  <g transform="translate(0,-135)">
  <rect class="zone" x="20" y="285" width="960" height="425" rx="10"/>
  <text class="z" x="36" y="306">VPC /16 · eu-west-1</text>
  <text class="z" x="265" y="320" text-anchor="middle">AZ a</text>
  <text class="z" x="555" y="320" text-anchor="middle">AZ b</text>

  <text class="z" x="36" y="363">PUBLIC</text>
  <text class="z" x="36" y="453">APP</text>
  <text class="z" x="36" y="543">DATA</text>

  <rect class="box" x="130" y="330" width="270" height="56" rx="6"/>
  <text class="t" x="265" y="353" text-anchor="middle">public a · /24</text>
  <text class="s" x="265" y="371" text-anchor="middle">ALB · NAT a (dev instance, prod gateway)</text>

  <rect class="box" x="420" y="330" width="270" height="56" rx="6"/>
  <text class="t" x="555" y="353" text-anchor="middle">public b · /24</text>
  <text class="s" x="555" y="371" text-anchor="middle">ALB · NAT b (prod only)</text>

  <rect class="box" x="720" y="330" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="353" text-anchor="middle">Internet gateway</text>
  <text class="s" x="840" y="371" text-anchor="middle">public route 0.0.0.0/0</text>
  <line class="e" x1="690" y1="358" x2="718" y2="358" marker-end="url(#arrow)"/>

  <rect class="box" x="130" y="420" width="270" height="56" rx="6"/>
  <text class="t" x="265" y="443" text-anchor="middle">private-app a · /24</text>
  <text class="s" x="265" y="461" text-anchor="middle">Fargate task · Arm64 · IAM DB auth</text>

  <rect class="box" x="420" y="420" width="270" height="56" rx="6"/>
  <text class="t" x="555" y="443" text-anchor="middle">private-app b · /24</text>
  <text class="s" x="555" y="461" text-anchor="middle">Fargate task (prod 2+, autoscaled)</text>

  <line class="e" x1="265" y1="420" x2="265" y2="388" marker-end="url(#arrow)"/>
  <text class="el" x="272" y="408">0.0.0.0/0 → NAT a</text>
  <line class="e" x1="555" y1="420" x2="555" y2="388" marker-end="url(#arrow)"/>
  <text class="el" x="562" y="408">→ NAT b (prod), NAT a (dev)</text>

  <rect class="box" x="720" y="420" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="443" text-anchor="middle">S3 gateway endpoint</text>
  <text class="s" x="840" y="461" text-anchor="middle">free · ECR layer bucket only</text>

  <rect class="box" x="130" y="510" width="270" height="74" rx="6"/>
  <text class="t" x="265" y="533" text-anchor="middle">private-data a · /24</text>
  <text class="s" x="265" y="551" text-anchor="middle">RDS PostgreSQL 17 primary</text>
  <text class="s" x="265" y="568" text-anchor="middle">Valkey 8.2 primary</text>

  <rect class="box" x="420" y="510" width="270" height="74" rx="6"/>
  <text class="t" x="555" y="533" text-anchor="middle">private-data b · /24</text>
  <text class="s" x="555" y="551" text-anchor="middle">RDS Multi-AZ standby (prod)</text>
  <text class="s" x="555" y="568" text-anchor="middle">Valkey replica, auto failover (prod)</text>

  <line class="e" x1="180" y1="478" x2="180" y2="508" marker-end="url(#arrow)"/>
  <line class="e" x1="470" y1="478" x2="470" y2="508" marker-end="url(#arrow)"/>
  <text class="el" x="187" y="497">5432 · 6379 TLS, app SG only</text>
  <text class="el" x="477" y="497">same rules in AZ b</text>

  <rect class="box" x="130" y="604" width="560" height="56" rx="6"/>
  <text class="t" x="410" y="627" text-anchor="middle">KMS data key · Secrets Manager · app security group</text>
  <text class="s" x="410" y="645" text-anchor="middle">RDS-managed DB password · Valkey AUTH token · app SG</text>

  <rect class="box" x="720" y="496" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="519" text-anchor="middle">Interface endpoints</text>
  <text class="s" x="840" y="537" text-anchor="middle">prod · ECR, Logs, Secrets</text>

  <rect class="box" x="720" y="562" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="585" text-anchor="middle">VPC flow logs</text>
  <text class="s" x="840" y="603" text-anchor="middle">prod · CloudWatch · KMS key</text>

  <rect class="box" x="720" y="628" width="240" height="56" rx="6"/>
  <text class="t" x="840" y="651" text-anchor="middle">ECR · migration task</text>
  <text class="s" x="840" y="669" text-anchor="middle">immutable tags · one-off ECS task</text>

  <text class="el" x="130" y="682">ALB: CloudFront only (prefix list + header) · no auto public IPs</text>
  <text class="el" x="130" y="698">dev 10.10.0.0/16 · prod 10.20.0.0/16</text>
  </g>

  <!-- Detection and observability -->
  <rect class="box" x="20" y="593" width="185" height="56" rx="6"/>
  <text class="t" x="112" y="616" text-anchor="middle">CloudTrail (account)</text>
  <text class="s" x="112" y="634" text-anchor="middle">all Regions · validated</text>
  <rect class="box off" x="213" y="593" width="117" height="56" rx="6"/>
  <text class="t" x="271" y="616" text-anchor="middle">GuardDuty</text>
  <text class="s" x="271" y="634" text-anchor="middle">off: Free plan</text>
  <rect class="box" x="340" y="593" width="300" height="56" rx="6"/>
  <text class="t" x="490" y="616" text-anchor="middle">Access-log bucket (per env)</text>
  <text class="s" x="490" y="634" text-anchor="middle">ALB · CloudFront · S3 access logs</text>
  <rect class="box" x="660" y="593" width="320" height="56" rx="6"/>
  <text class="t" x="820" y="616" text-anchor="middle">CloudWatch alarms · dashboard</text>
  <text class="s" x="820" y="634" text-anchor="middle">ALB · ECS · RDS · Valkey → SNS email</text>

  <!-- CI/CD -->
  <text class="z" x="20" y="683">CI/CD · GITHUB OIDC, NO STORED KEYS · DEV DEPLOYED FROM CI IN 22 MIN 54 S</text>
  <rect class="box" x="20" y="695" width="250" height="56" rx="6"/>
  <text class="t" x="145" y="718" text-anchor="middle">GitHub Actions</text>
  <text class="s" x="145" y="736" text-anchor="middle">CI on PRs · manual deploy</text>
  <rect class="box" x="340" y="695" width="270" height="56" rx="6"/>
  <text class="t" x="475" y="718" text-anchor="middle">STS · deploy role per env</text>
  <text class="s" x="475" y="736" text-anchor="middle">immutable OIDC subject per env</text>
  <rect class="box" x="680" y="695" width="300" height="56" rx="6"/>
  <text class="t" x="830" y="718" text-anchor="middle">CloudFormation exec role</text>
  <text class="s" x="830" y="736" text-anchor="middle">builds the stacks · bounded IAM</text>
  <line class="e" x1="270" y1="723" x2="338" y2="723" marker-end="url(#arrow)"/>
  <text class="el" x="304" y="715" text-anchor="middle">OIDC</text>
  <line class="e" x1="610" y1="723" x2="678" y2="723" marker-end="url(#arrow)"/>
  <text class="el" x="644" y="715" text-anchor="middle">PassRole</text>

  <!-- Measured failovers -->
  <text class="z" x="20" y="785">FAILOVER TESTS · PROD, 17 NOVEMBER 2026 · RDS RUN TWICE, k6 THROUGH CLOUDFRONT</text>
  <rect class="box" x="20" y="797" width="300" height="56" rx="6"/>
  <text class="t" x="170" y="820" text-anchor="middle">Task stopped: 0 errors</text>
  <text class="s" x="170" y="838" text-anchor="middle">replacement healthy in 58 s</text>
  <rect class="box warn" x="340" y="797" width="300" height="56" rx="6"/>
  <text class="t" x="490" y="820" text-anchor="middle">RDS failover: 29 s, then 48 s</text>
  <text class="s" x="490" y="838" text-anchor="middle">app DB errors ~6, then 11–14 min (IAM auth)</text>
  <rect class="box" x="660" y="797" width="320" height="56" rx="6"/>
  <text class="t" x="820" y="820" text-anchor="middle">Valkey failover: 22 s</text>
  <text class="s" x="820" y="838" text-anchor="middle">0 errors · reads fell back to PostgreSQL</text>
</svg>
