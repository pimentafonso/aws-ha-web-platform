  <text class="t" x="480" y="308" text-anchor="middle">CloudFront · WAF (prod) · HTTPS</text>
  <text class="s" x="480" y="326" text-anchor="middle">certs + WAF in us-east-1 · adds X-Origin-Verify</text>
  <rect class="box code" x="740" y="285" width="220" height="56" rx="6"/>
  <text class="t" x="850" y="308" text-anchor="middle">S3 static (private)</text>
