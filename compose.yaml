# Local stand-ins for RDS PostgreSQL and ElastiCache Redis.
# Credentials here are for local development only.
name: ha-web-platform

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes-local-only
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "127.0.0.1:6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  api:
    build: ./app
    profiles: ["app"]
    environment:
      DB_HOST: postgres
      DB_NAME: notes
      DB_USER: notes
      DB_PASSWORD: notes-local-only
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
